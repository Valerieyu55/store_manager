<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一杯剛剛好｜YOUR TEA COMPANY 營業版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E3EAD6; --panel:#FFFDF7; --ink:#3A2A20; --ink-soft:#6B5646;
  --wood:#9A6A44; --wood-dark:#6A4429; --berry:#D2566F; --honey:#E2A33C;
  --matcha:#5E8B45; --line:#D8CDBB; --chip:#F3EBDD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1D2620; --panel:#2A231E; --ink:#F2E8DA; --ink-soft:#CBB9A5;
    --line:#4A3E34; --chip:#362D26;
  }
}
:root[data-theme="dark"]{
  --page:#1D2620; --panel:#2A231E; --ink:#F2E8DA; --ink-soft:#CBB9A5;
  --line:#4A3E34; --chip:#362D26;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}

/* ---------- Title screen ---------- */
#title{max-width:1100px;margin:0 auto;padding:28px 20px 40px}
.logo{text-align:center;margin:8px 0 4px}
.logo h1{
  font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0;letter-spacing:.04em;
  color:var(--wood-dark);
  text-shadow:3px 3px 0 var(--panel),5px 5px 0 var(--honey);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo h1{color:var(--honey);text-shadow:3px 3px 0 var(--wood-dark)}}
.logo p{margin:10px 0 0;color:var(--ink-soft);font-size:18px}
.stage-line{
  position:relative;margin:26px auto 0;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end;
  padding:0 8px;
}
.stage-line::after{
  content:"";position:absolute;left:0;right:0;bottom:-18px;height:40px;z-index:0;
  background:linear-gradient(var(--wood),var(--wood-dark));border-radius:10px;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
}
.dept{
  position:relative;z-index:1;background:none;border:0;padding:0;
  display:flex;flex-direction:column;align-items:center;
}
.dept img{height:clamp(170px,30vw,330px);width:auto;display:block;transition:transform .2s}
.dept:not(:disabled):hover img{transform:translateY(-6px)}
.dept:disabled{cursor:not-allowed}
.dept:disabled img{filter:grayscale(1) opacity(.45)}
.dept .lock{
  position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  background:var(--panel);border:2px solid var(--ink);border-radius:999px;
  padding:4px 12px;font-size:14px;white-space:nowrap;
}
.cards{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;
  margin:38px 8px 0;
}
.card{
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
  padding:10px 10px 12px;text-align:center;
}
.card b{display:block;font-size:17px}
.card span{display:block;color:var(--ink-soft);font-size:14px}
.card .stars{color:var(--honey);font-size:18px;letter-spacing:2px;min-height:26px}
.teacher{display:block;margin:28px auto 0;background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-size:14px}
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .card:last-child{grid-column:span 2}
}

/* ---------- Game screen ---------- */
#game{max-width:1100px;margin:0 auto;padding:12px 16px 24px}
.hud{
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
  padding:8px 14px;
}
.hud .lv{font-size:19px;margin-right:auto}
.hud .stat{display:flex;align-items:center;gap:6px;font-size:16px;white-space:nowrap}
.hud .money{color:var(--matcha);font-size:20px}
.hearts{letter-spacing:2px;font-size:18px}
.combo{color:var(--honey)}
.back{background:var(--chip);border:0;border-radius:999px;padding:4px 12px;font-size:14px}

.play{
  display:grid;grid-template-columns:220px minmax(0,1fr) 220px;gap:16px;
  margin-top:14px;align-items:start;
}
.host{position:relative;display:flex;flex-direction:column;align-items:center}
.host img{height:380px;width:auto;display:block}
.bubble{
  position:relative;background:var(--panel);border:2px solid var(--ink);
  border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.5;margin-bottom:10px;
  width:100%;
}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;
  background:var(--panel);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:translateX(-50%) rotate(45deg);
}

.ticket{
  background:var(--panel);border:2px solid var(--line);border-radius:6px 6px 16px 16px;
  padding:18px 20px 20px;position:relative;
  background-image:radial-gradient(circle at 10px 0,var(--page) 7px,transparent 8px);
  background-size:20px 14px;background-repeat:repeat-x;background-position:0 -1px;
}
.ticket .who{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ticket .face{position:relative;flex:none;width:72px;height:72px}
.ticket .face img{width:72px;height:72px;border-radius:50%;background:var(--chip);border:3px solid var(--wood);object-fit:cover;display:block}
.ticket .face em{
  position:absolute;left:54px;top:-10px;z-index:2;font-style:normal;font-size:13px;white-space:nowrap;
  background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:0 8px;
}
.ticket .face em:empty{display:none}
.face.happy img{animation:hop .5s ease-out;border-color:var(--matcha)}
.face.angry img{animation:shake .4s;border-color:var(--berry);filter:saturate(.6)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ticket .who small{display:block;color:var(--ink-soft);font-size:14px}
.ticket .order{font-size:20px}
.patience{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0 12px}
.patience i{display:block;height:100%;width:100%;background:var(--matcha);transition:background .3s}
.q{font-size:19px;line-height:1.75;margin:0 0 6px}
.q .ratio{
  display:inline-block;background:var(--chip);border-radius:8px;padding:0 8px;margin:2px 0;
  font-size:21px;white-space:nowrap;
}
.ask{font-size:18px;color:var(--wood-dark);margin:10px 0 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ask{color:var(--honey)}}
:root[data-theme="dark"] .ask{color:var(--honey)}

.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  background:var(--chip);border:2px solid var(--line);border-radius:12px;
  padding:12px 8px;font-size:22px;
}
.opt:hover{border-color:var(--wood)}
.opt.right{background:#DDEFD2;border-color:var(--matcha);color:#2F4A22}
.opt.wrong{background:#F7D9DF;border-color:var(--berry);color:#6B1E2E}

.fields{display:grid;gap:10px}
.field{display:flex;align-items:center;gap:10px}
.field .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.field label{min-width:5.5em}
.field input{
  width:120px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;
  background:var(--panel);font-size:20px;text-align:right;
}
.field input:disabled{background:var(--chip);color:var(--ink-soft)}
.field input.bad{border-color:var(--berry)}
.field input.ok{border-color:var(--matcha)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{
  border:0;border-radius:999px;padding:10px 22px;font-size:18px;
  background:var(--wood-dark);color:#FFF7EA;box-shadow:0 4px 0 #4A2E1B;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4A2E1B}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.msg{min-height:1.6em;color:var(--berry);font-size:15px;margin-top:8px}

.verdict{
  margin-top:14px;border-radius:14px;padding:12px 16px;border:2px solid;
  font-size:16px;line-height:1.7;
}
.verdict.good{background:#E6F2DC;border-color:var(--matcha);color:#2F4A22}
.verdict.badv{background:#FBE5E9;border-color:var(--berry);color:#5E1A28}
.verdict h3{margin:0 0 4px;font-size:19px}

.cupbox{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.cupbox .cap{font-size:14px;color:var(--ink-soft)}
.cupbox svg{width:100%;height:auto;display:block}

.queue{
  position:relative;margin-top:22px;height:250px;overflow:hidden;
  display:flex;align-items:flex-end;gap:4px;padding:0 18px;
}
.queue::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:44px;border-radius:12px;
  background:linear-gradient(var(--wood),var(--wood-dark));box-shadow:0 -4px 0 rgba(0,0,0,.08);
}
.queue{gap:18px}
.queue img{flex:none;max-width:none;height:210px;width:auto;display:block;margin-bottom:-24px;opacity:.9}
.queue img.now{height:260px;opacity:1}
.queue .label{position:absolute;right:18px;bottom:10px;z-index:1;color:#FFF3E0;font-size:15px}
@media (max-width:600px){.queue{height:190px;gap:8px}.queue img{height:150px;margin-bottom:-20px}.queue img.now{height:195px}}

.boss-timer{font-size:20px;color:var(--berry)}

@media (max-width:900px){
  .play{grid-template-columns:minmax(0,1fr)}
  .host{flex-direction:row-reverse;justify-content:flex-end;align-items:flex-end;gap:10px}
  .bubble{flex:1}
  .host img{height:170px}
  .bubble{margin:0 0 20px}
  .bubble::after{left:-9px;bottom:18px;transform:rotate(135deg)}
  .q .ratio{white-space:normal;font-size:19px}
  .cupbox{display:grid;grid-template-columns:140px 1fr;align-items:center;text-align:left;gap:8px}
}

/* ---------- Result ---------- */
#result{max-width:640px;margin:0 auto;padding:30px 20px}
.report{
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:24px;
  display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center;
}
.report img{height:260px;width:auto}
.report h2{margin:0;font-size:28px}
.report .bigstars{font-size:40px;color:var(--honey);letter-spacing:4px}
.report dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0}
.report dt{color:var(--ink-soft)}
.report dd{margin:0}
@media (max-width:520px){.report{grid-template-columns:1fr;text-align:center}.report img{height:180px;margin:0 auto}.report dl{text-align:left}}

.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Course layer ---------- */
.topbar{
  max-width:1100px;margin:12px auto 0;padding:8px 14px;display:flex;align-items:center;gap:12px;
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
}
.topbar b{margin-right:auto;font-size:18px}
.teacher-flag{background:var(--honey);color:#3A2A20;border-radius:999px;padding:2px 10px;font-size:13px}
#onboard{max-width:560px;margin:0 auto;padding:40px 20px}
.form-card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:22px;display:grid;gap:14px}
.form-card label{display:block;font-size:15px;color:var(--ink-soft);margin-bottom:4px}
.form-card input,.core input[type=text]{
  width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:18px;
}
.err{color:var(--berry);font-size:15px;min-height:1.4em;margin-top:8px}
.linkbtn{display:block;margin:18px auto 0;background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-size:14px}
#office{max-width:1100px;margin:0 auto;padding:20px 20px 40px}
.office-head{text-align:center}
.office-head small{color:var(--ink-soft);font-size:15px}
.office-head h1{margin:2px 0 0;font-size:clamp(30px,6vw,48px);color:var(--wood-dark);line-height:1.2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .office-head h1{color:var(--honey)}}
:root[data-theme="dark"] .office-head h1{color:var(--honey)}
.office-head p{margin:6px 0 0;color:var(--ink-soft)}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:38px 8px 0}
.node{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.node.locked{opacity:.55}
.node.current{border-color:var(--honey);box-shadow:0 0 0 3px rgba(226,163,60,.25)}
.node .mno{font-size:13px;color:var(--ink-soft)}
.node b{font-size:18px;line-height:1.3}
.node .skill{font-size:14px;color:var(--ink-soft)}
.steps{list-style:none;margin:4px 0;padding:0;font-size:14px;display:grid;gap:2px}
.steps li::before{content:"○ ";color:var(--ink-soft)}
.steps li.done::before{content:"✓ ";color:var(--matcha)}
.node .stars{color:var(--honey);letter-spacing:2px}
.node .btn{font-size:15px;padding:8px 12px;width:100%}
.node .btn+.btn{margin-top:4px}
.office-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
@media (max-width:760px){.path{grid-template-columns:1fr 1fr}.node:last-child{grid-column:span 2}}

#chat,#core{max-width:900px;margin:0 auto;padding:16px 20px 40px}
.chat-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.chat-host img{height:360px;width:auto;display:block;margin:0 auto}
.chat-log{display:grid;gap:12px}
.msg-b{
  background:var(--panel);border:2px solid var(--ink);border-radius:4px 18px 18px 18px;padding:12px 16px;
  font-size:17px;max-width:560px;animation:pop .3s ease-out;
}
.receipt{
  background:#FFFDF2;color:#3A2A20;border:2px dashed #9A6A44;border-radius:6px;padding:10px 16px;max-width:320px;
  font-size:15px;box-shadow:3px 3px 0 rgba(0,0,0,.08);animation:pop .3s ease-out;
}
.receipt.l{transform:rotate(-1.5deg)} .receipt.r{transform:rotate(1.5deg);margin-left:24px}
.receipt big{display:block;font-size:22px;margin-top:2px}
.explain{background:var(--chip);border-left:5px solid var(--honey);border-radius:10px;padding:12px 16px;font-size:16px;animation:pop .3s ease-out}
.explain h3{margin:0 0 4px;font-size:19px}
.choice-row{display:grid;gap:8px;max-width:420px}
.choice{background:var(--panel);border:2px solid var(--wood);border-radius:14px;padding:12px 16px;text-align:left;font-size:17px}
.choice:hover{background:var(--chip)}
@media (max-width:760px){.chat-wrap{grid-template-columns:1fr}.chat-host img{height:180px}}

.core-card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px 22px}
.core-step{font-size:14px;color:var(--ink-soft);letter-spacing:.08em}
.core-prompt{font-size:18px;line-height:1.8;margin:6px 0 12px}
.recap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.recap span{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:14px}
.teacher-answer{background:#FFF1CC;color:#5A3E00;border-radius:10px;padding:8px 12px;font-size:15px;margin:8px 0}
.hint-t{background:none;border:0;color:var(--wood);text-decoration:underline;padding:0;font-size:15px}
.hint-box{display:none;background:var(--chip);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:15px}
.hint-box.show{display:block}
.okmsg{color:var(--matcha);min-height:1.5em;margin-top:8px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.1;margin:0 2px}
.frac .fn{border-bottom:1.5px solid currentColor;padding:0 3px}

.ratio-card{background:var(--chip);border-radius:14px;padding:12px 14px;margin:10px 0}
.ratio-card .lab{font-size:15px;color:var(--ink-soft)}
.ratio-line{display:flex;align-items:center;gap:8px;font-size:30px;margin:4px 0}
.term{min-width:52px;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:0 8px}
.term.shared{border-color:var(--honey);background:#FFF1CC;color:#3A2A20}
.mult{display:flex;align-items:center;gap:8px;font-size:15px}
.mult button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.mult input{width:64px;padding:6px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:18px;background:var(--panel)}
.match{margin:10px 0;padding:8px 12px;border-radius:10px;background:var(--chip);font-size:15px}
.match.ok{background:#E6F2DC;color:#2F4A22}
.combined{font-size:28px;text-align:center;min-height:1.4em;color:var(--matcha)}

.price-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
.price-card{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:14px}
.price-card big{display:block;font-size:26px}
.price-card.sel{border-color:var(--matcha);background:#E6F2DC;color:#2F4A22}
.price-card.inv big{text-decoration:line-through;opacity:.6}
.price-card .warn{color:var(--berry)}
@media (max-width:600px){.price-grid{grid-template-columns:1fr 1fr}}

.ad-wrap{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:18px;align-items:start}
.ad-canvas{width:160px;height:200px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.ad-band{display:flex;align-items:center;justify-content:center;font-size:14px;color:#3A2A20;transition:height .2s;overflow:hidden}
.ad-band.d{background:#F2B7C2}.ad-band.l{background:#F3DF8B}.ad-band.x{background:#CFE3C1}

.success{text-align:center}
.success .badge{font-size:48px}
.success h2{margin:4px 0;font-size:28px;color:var(--wood-dark)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .success h2{color:var(--honey)}}
.success .ratio-line{justify-content:center}
.success .actions{justify-content:center}

.plan-doc{background:#FFFDF2;color:#3A2A20;border:2px solid #9A6A44;border-radius:14px;padding:18px 20px;margin-top:14px;text-align:left}
.plan-doc .brand{font-size:14px;letter-spacing:.12em;color:#9A6A44}
.plan-doc .drink{font-size:24px;margin:2px 0 10px}
.plan-doc .row{display:flex;justify-content:space-between;border-bottom:1px dashed #D8CDBB;padding:4px 0}
.plan-doc .slogan{margin-top:10px;font-size:18px;text-align:center}
.custom-grid{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px 10px;align-items:end}
.custom-grid input{width:100%}


.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.back,.teacher-flag{white-space:nowrap;flex:none}
.plan-doc .row{gap:12px}.plan-doc .row b{white-space:nowrap}
@media (max-width:600px){.topbar{margin:10px 12px 0}.topbar b{font-size:15px}}

/* ---------- Animation layer ---------- */
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.015)}}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes walkIn{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
@keyframes walkOut{to{opacity:0;transform:translateX(-180px)}}
@keyframes bob{0%,100%{transform:translateY(0)}25%{transform:translateY(-5px)}50%{transform:translateY(0)}75%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}60%{transform:translateY(0)}75%{transform:translateY(-8px)}}
@keyframes huff{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0)}100%{transform:translate3d(var(--dx),105vh,0) rotate(var(--rot))}}
@keyframes starPop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}70%{opacity:1;transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(226,163,60,.25)}50%{box-shadow:0 0 0 7px rgba(226,163,60,.12)}}
@keyframes pulseBar{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(-6deg)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.8)}40%{opacity:.7}100%{opacity:0;transform:translateY(-26px) scale(1.2)}}
.alive{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}
.dept:nth-child(2) img{animation-delay:-.7s}.dept:nth-child(3) img{animation-delay:-1.4s}.dept:nth-child(4) img{animation-delay:-2.1s}.dept:nth-child(5) img{animation-delay:-2.8s}
.dept:not(:disabled) img{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}
.dept:not(:disabled):hover img{animation:jump .7s ease-out}
#onboard:not(.hidden),#office:not(.hidden),#chat:not(.hidden),#core:not(.hidden),#game:not(.hidden),#result:not(.hidden){animation:screenIn .4s ease-out}
.queue img{animation:walkIn .6s ease-out both}
.queue img:nth-of-type(2){animation-delay:.08s}.queue img:nth-of-type(3){animation-delay:.16s}.queue img:nth-of-type(4){animation-delay:.24s}
.queue img.now.idle{animation:walkIn .6s ease-out both, bob 2.6s ease-in-out .6s infinite}
.queue img.now.happy{animation:jump .7s ease-out}
.queue img.now.angry{animation:huff .5s}
.queue img.leave{animation:walkOut .45s ease-in forwards!important}
.queue.shift img:not(.leave){transition:transform .45s ease;transform:translateX(-40px)}
.face.hurry img{animation:huff .6s infinite;border-color:var(--berry)}
.patience.low i{animation:pulseBar .6s infinite}
.node.current{animation:glow 2s ease-in-out infinite}
.bubble.pop,.msg-b.pop{animation:pop .35s ease-out}
.receipt{animation:drop .45s cubic-bezier(.2,1.4,.5,1) both}
.typing{display:inline-flex;gap:5px;padding:14px 18px;background:var(--panel);border:2px solid var(--ink);border-radius:4px 18px 18px 18px;width:max-content}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.success .badge{display:inline-block;animation:jump 1.4s ease-in-out infinite}
.float-txt{position:fixed;z-index:60;pointer-events:none;font-size:24px;color:var(--matcha);font-weight:bold;text-shadow:0 2px 0 var(--panel);animation:rise 1.2s ease-out forwards}
.float-txt.bad{color:var(--berry)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:0;width:10px;height:14px;border-radius:3px;animation:fall var(--t) cubic-bezier(.25,.6,.4,1) forwards}
.confetti i.pearl{width:12px;height:12px;border-radius:50%;background:#2A1D17!important}
.bigstars span{display:inline-block;animation:starPop .6s ease-out both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.hud .money.bump{display:inline-block;animation:jump .5s ease-out}
.steam path{animation:steam 2.4s ease-out infinite}.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@media (prefers-reduced-motion:reduce){.confetti,.float-txt{display:none}}

/* ---------- Teacher dashboard ---------- */
#teacher{max-width:1100px;margin:0 auto;padding:20px 20px 40px}
.sync{display:inline-block;margin-top:8px;font-size:13px;border-radius:999px;padding:2px 12px;background:var(--chip);color:var(--ink-soft)}
.sync.cloud{background:#E6F2DC;color:#2F4A22}
.t-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.t-card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.t-card small{color:var(--ink-soft);font-size:13px}
.t-card b{display:block;font-size:28px;line-height:1.3}
.t-card .bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:6px}
.t-card .bar i{display:block;height:100%;background:var(--matcha)}
.t-depts{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 10px}
.t-chips button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px}
.t-chips button.on{background:var(--wood-dark);color:#FFF7EA;border-color:var(--wood-dark)}
.t-list{display:grid;gap:8px}
.t-row{background:var(--panel);border:2px solid var(--line);border-radius:14px}
.t-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;width:100%;background:none;border:0;text-align:left}
.t-head b{font-size:17px}
.t-head small{display:block;color:var(--ink-soft);font-size:13px}
.dots{display:flex;gap:4px}
.dots span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--chip);color:var(--ink-soft)}
.dots span.done{background:var(--matcha);color:#fff}
.dots span.mid{background:var(--honey);color:#3A2A20}
.t-rate{font-size:15px;white-space:nowrap}
.t-detail{display:none;padding:0 14px 14px}
.t-row.open .t-detail{display:block}
.t-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.t-grid div{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.6}
.t-grid div b{display:block;font-size:15px}
.t-del{background:none;border:0;color:var(--berry);font-size:13px;text-decoration:underline;margin-top:10px}
.t-empty{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--ink-soft)}
@media (max-width:760px){.t-sum{grid-template-columns:1fr 1fr}.t-depts,.t-grid{grid-template-columns:1fr 1fr}.t-head{grid-template-columns:1fr auto}.t-head .dots{grid-column:1/-1}}

body{
  background:transparent;
  font-family:'Noto Sans TC',"PingFang TC","Microsoft JhengHei",sans-serif; font-weight:500;
}
b,strong{font-weight:900}
/* titles: neon offset style */
.logo h1,.office-head h1,.success h2,.report h2{
  font-family:var(--font-display); font-weight:900; color:var(--ink)!important;
  -webkit-text-stroke:1px var(--ink); text-shadow:3px 3px 0 var(--peach)!important; letter-spacing:.03em;
}
.logo h1{text-shadow:4px 4px 0 var(--peach)!important}
.logo p,.office-head p{color:var(--ink-soft);font-weight:700}
.office-head small,.core-step,.mno{font-family:'Space Mono','Noto Sans TC',monospace;letter-spacing:.08em;font-weight:700}
/* panels: thick ink outline + hard shadow */
.hud,.topbar,.ticket,.cupbox,.node,.form-card,.core-card,.report,.card,.t-card,.t-row,.t-empty,.verdict{
  border:3px solid var(--ink)!important; box-shadow:5px 5px 0 var(--hard);
}
.hud,.topbar{background:var(--panel);border-radius:14px}
.hud .lv,.topbar b{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:2px 10px;color:var(--berry);font-weight:900}
.node,.form-card,.core-card,.ticket{background:var(--panel-2)}
.node.current{border-color:var(--plum)!important}
.ticket{background-image:none;border-radius:14px}
.bubble,.msg-b,.typing{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hard);font-weight:700}
.bubble::after{border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.receipt{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:2px;font-family:'Space Mono','Noto Sans TC',monospace;box-shadow:4px 4px 0 var(--hard)}
.explain{background:var(--panel);border:3px solid var(--ink);border-left:8px solid var(--peach);box-shadow:5px 5px 0 var(--hard)}
.choice{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;border-radius:16px}
.choice:hover{background:var(--chip);transform:translate(-1px,-1px)}
.ratio-card{background:var(--panel-2);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hard)}
.term{background:var(--panel);border:2.5px solid var(--ink);border-radius:8px;font-weight:900}
.term.shared{background:#ecdcf5;border-color:var(--plum);color:#1c1c1c}
.q .ratio{background:#ecdcf5;color:#1c1c1c;border:2px solid var(--ink);font-weight:700}
.price-card{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hard)}
.price-card.sel{background:#e3f0e3;border-color:var(--matcha);color:#1c1c1c}
.plan-doc{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--hard);border-radius:10px}
.plan-doc .brand{color:var(--plum)}
/* buttons: lavender with hard ink shadow */
.btn{background:var(--peach);color:#1c1c1c;border:3px solid var(--ink);border-radius:14px;font-weight:900;box-shadow:5px 5px 0 var(--ink)}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.back{background:var(--panel);border:2px solid var(--ink);border-radius:8px;font-weight:900}
.opt{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hard);font-weight:900}
.opt:hover{border-color:var(--plum)}
.opt.right{background:#e3f0e3;border-color:var(--matcha)}
.opt.wrong{background:#f8e0da;border-color:var(--berry)}
.field input,.form-card input,.mult input,.custom-grid input{background:var(--panel);border:3px solid var(--ink);border-radius:10px;font-weight:700}
.field input:focus,.form-card input:focus{box-shadow:3px 3px 0 var(--peach);outline:none}
.field input.ok{border-color:var(--matcha);box-shadow:3px 3px 0 var(--matcha)}
.field input.bad{border-color:var(--berry);box-shadow:3px 3px 0 var(--berry)}
.mult button{border:2.5px solid var(--ink);background:var(--panel);font-weight:900}
.patience{border:2px solid var(--ink);height:14px}
.verdict.good{background:#e3f0e3;color:#1c1c1c}
.verdict.badv{background:#f8e0da;color:#1c1c1c}
.hint-t{color:var(--taro);font-weight:900}
.teacher-answer{background:#fff3d6;border:2px dashed var(--ink);color:#1c1c1c}
/* counters: lavender shop counter with ink outline */
.stage-line::after,.queue::after{
  background:repeating-linear-gradient(90deg,var(--peach) 0 26px,#a97bbb 26px 52px);
  border:3px solid var(--ink); box-shadow:5px 5px 0 var(--hard);
}
.queue .label{color:#1c1c1c;font-weight:900;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.dept .lock{border-width:3px;font-weight:900}
.face img{border:3px solid var(--ink)!important}
.face.happy img{border-color:var(--matcha)!important}
.face.angry img,.face.hurry img{border-color:var(--berry)!important}
.ticket .face em{border-width:2.5px;font-weight:900}
.steps li.done::before{color:var(--matcha)}
.node .stars,.card .stars,.bigstars{color:var(--honey)}
.sync{border:2px solid var(--ink);font-weight:700}
.sync.cloud{background:#e3f0e3;color:#1c1c1c}
.t-chips button{border:2.5px solid var(--ink);font-weight:700}
.t-chips button.on{background:var(--peach);color:#1c1c1c;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.t-card .bar{border:2px solid var(--ink)}
.t-card .bar i{background:var(--peach)}
.dots span{border:2px solid var(--ink)}
.dots span.done{background:var(--matcha)}
.dots span.mid{background:var(--peach);color:#1c1c1c}
.t-grid div{background:var(--panel-2);border:2px solid var(--ink)}
.teacher-flag{background:var(--peach);color:#1c1c1c;border:2px solid var(--ink);font-weight:900}
.float-txt{text-shadow:2px 2px 0 var(--ink);color:#e3f0e3}
.float-txt.bad{color:#f8e0da}
.success .ratio-line .term{font-family:var(--font-display);font-size:34px}
.ad-canvas{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hard)}
.ticket .who{padding-top:14px}
.ticket .face em{top:-16px}
.ad-band.d{background:#e4c7ef}.ad-band.l{background:#f2ecd8}.ad-band.x{background:#cfe3cf}

/* ---------- Drink artwork ---------- */
.hero-drink{width:130px;height:130px;margin:0 auto 14px;border-radius:50%;background:var(--peach);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--hard);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-drink img{width:78%;height:auto;animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
.drink-ico{height:1em;width:auto;vertical-align:-.12em;margin-right:.2em;animation:sway 3s ease-in-out infinite}
.success .badge{position:relative;width:120px;height:120px;margin:0 auto}
.badge-drink{width:110px;height:auto}
.badge-emo{position:absolute;right:-6px;top:-4px;font-size:34px;background:var(--panel);border:3px solid var(--ink);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--hard)}
.fly-drink{position:fixed;z-index:65;width:90px;height:auto;pointer-events:none;transform:translate(-50%,-50%)}
.report img.res-drink{height:auto;width:78px;margin:0}
.res-drink{position:absolute;right:18px;top:-30px;width:78px;height:auto;animation:sway 3s ease-in-out infinite;filter:drop-shadow(3px 3px 0 var(--hard))}
.report{position:relative}
@media (max-width:520px){.report img.res-drink{width:60px}.res-drink{width:60px;right:10px;top:-24px}}

.pw-mask{position:fixed;inset:0;z-index:80;background:rgba(28,28,28,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.pw-box{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--hard);padding:22px;width:min(360px,100%);text-align:center}
.pw-box h2{margin:0;font-size:24px}
.pw-box p{margin:6px 0 12px;color:var(--ink-soft)}
.pw-box input{width:100%;padding:10px 12px;font-size:24px;letter-spacing:.3em;text-align:center;border:3px solid var(--ink);border-radius:12px;background:var(--panel)}
.pw-box .actions{justify-content:center}

.sfx-btn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:75;width:48px;height:48px;border-radius:50%;
  background:var(--panel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.sfx-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- Icons & UI placement ---------- */
.ic{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em}
.btn,.back,.linkbtn,.icon-pill,.danger-link,.choice{display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.btn .ic{width:1.2em;height:1.2em}
.back .ic{width:1.05em;height:1.05em}
.node .btn{justify-content:center}
#office{position:relative}
.office-corner{position:absolute;top:18px;right:20px;display:flex;gap:8px;z-index:2}
.icon-pill{border:2.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.icon-pill:hover{background:var(--chip)}
.icon-pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.edit-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-left:10px;vertical-align:middle;
  border:2.5px solid var(--ink);border-radius:50%;background:var(--panel);box-shadow:2px 2px 0 var(--ink);color:var(--ink);font-size:16px;-webkit-text-stroke:0;text-shadow:none;position:relative;top:-.15em}
.edit-btn:hover{background:var(--peach)}
.edit-btn .ic{width:18px;height:18px}
.office-tools:empty,.office-tools:not(:has(button:not(.hidden))){display:none}
.danger-zone{text-align:center;margin-top:30px;padding-top:16px;border-top:2px dashed var(--line);opacity:.9}
.danger-link{background:none;border:0;color:var(--berry);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.danger-link:hover{background:#f8e0da;border-radius:8px}
.linkbtn{margin:18px auto 0;display:flex}
.pw-box h2{display:flex;align-items:center;justify-content:center;gap:.4em}
.sfx-btn .ic{width:24px;height:24px}
.sfx-btn{color:var(--ink)}
.dept .lock{display:inline-flex;align-items:center;gap:.3em}
@media (max-width:600px){.office-head{padding-top:30px}.dept .lock .lt{display:none}.dept .lock{padding:4px 7px}.office-corner{top:10px;right:12px}.edit-btn{width:30px;height:30px;margin-left:6px}}

.bgm-btn{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.bgm-btn.off,.sfx-btn.off{opacity:.75}

/* ---------- Settings & floating buttons ---------- */
.fabs{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:75;display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.fab .ic{width:24px;height:24px}
.fab:hover{background:var(--chip)}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.fab.off{opacity:.7}
#setBtn{background:var(--peach);color:#1c1c1c}
#setBtn:hover .ic{transform:rotate(60deg);transition:transform .3s}
.set-box{background:var(--panel);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--hard);width:min(460px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:18px 20px 20px}
.set-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.set-head h2{margin:0;font-size:24px;display:flex;align-items:center;gap:.4em}
.set-x{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center}
.set-sec{border-top:2px dashed var(--line);padding:14px 0 6px}
.set-sec h3{margin:0 0 8px;font-size:15px;color:var(--plum);display:flex;align-items:center;gap:.4em;letter-spacing:.05em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .set-sec h3{color:var(--peach)}}
:root[data-theme="dark"] .set-sec h3{color:var(--peach)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-weight:700}
.set-row small{display:block;font-size:12px;font-weight:500;color:var(--ink-soft)}
.set-row input[type=range]{flex:1;accent-color:var(--plum);max-width:220px}
.set-row output{min-width:3em;text-align:right;font-family:'Space Mono',monospace;font-size:14px}
.switch{flex:none;width:56px;height:30px;border-radius:999px;border:2.5px solid var(--ink);background:var(--chip);position:relative;padding:0}
.switch i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--panel);border:2px solid var(--ink);transition:left .2s}
.switch[aria-checked="true"]{background:var(--matcha)}
.switch[aria-checked="true"] i{left:27px}
.seg{display:flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--peach);color:#1c1c1c}
.set-who{margin:0 0 10px;line-height:1.6}
.set-btns{display:flex;flex-wrap:wrap;gap:10px}
.set-sec .btn{font-size:15px;padding:8px 14px}
.set-danger{text-align:center;padding-top:12px}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
html.calm .confetti,html.calm .float-txt{display:none}
/* dark theme background fix */
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:var(--bg-tile) 0 0/220px 220px,var(--page)}}
html[data-theme="dark"]{background:var(--bg-tile) 0 0/220px 220px,var(--page)}
@media (max-width:420px){.seg button{padding:6px 7px;font-size:13px}.set-row{flex-wrap:wrap}}

/* ---------- Cute icons ---------- */
.back{background:var(--peach)!important;color:#1c1c1c!important;padding:4px 12px 4px 8px!important;font-size:15px;gap:.35em}
.back .ic{width:38px!important;height:38px!important;color:#1c1c1c}
.back:hover .ic,.btn:hover .ic-cute{animation:jump .6s ease-out}
.btn .ic.ic-cute{width:2.1em;height:2.1em;margin:-.45em 0}
#setBtn{width:62px;height:62px;background:var(--peach)}
#setBtn .ic{width:48px;height:48px;color:#1c1c1c}
#setBtn:hover .ic{transform:rotate(45deg);transition:transform .35s ease}
#sndBtn{width:50px;height:50px;align-self:center}
.set-head h2 .ic{width:34px;height:34px}
.fabs{align-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #setBtn .ic,:root:not([data-theme="light"]) .back .ic{color:#1c1c1c}}

.hearts{display:inline-flex;gap:3px;align-items:center}
.hearts .ic{width:22px;height:22px}
.verdict h3,.explain h3{display:flex;align-items:center;gap:.4em}
.verdict h3 .ic,.explain h3 .ic{width:1.5em;height:1.5em}
.badge-emo .ic{width:32px;height:32px}
.boss-timer .ic{width:1.2em;height:1.2em}
.msg-b .ic,.teacher-answer .ic,.hint-t .ic,.msg .ic,.t-detail .ic{width:1.35em;height:1.35em;vertical-align:-.3em}
.sync .ic{width:1.3em;height:1.3em;vertical-align:-.3em}

/* ---------- identity card (quick rename) ---------- */
.id-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.id-card{display:inline-flex;align-items:center;gap:10px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 6px;box-shadow:4px 4px 0 var(--ink);text-align:left;cursor:pointer}
.id-card:hover{background:var(--chip);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.id-card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.id-ava{width:38px;height:38px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;color:#1c1c1c}
.id-ava .ic{width:30px;height:30px}
.id-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.id-txt b{font-size:17px}
.id-txt small{font-size:13px;color:var(--ink-soft);font-weight:700;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-edit{display:inline-flex;align-items:center;gap:.3em;background:var(--peach);color:#1c1c1c;border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.id-edit .ic{width:1.1em;height:1.1em}
.id-card:hover .id-edit .ic{animation:jump .5s ease-out}
.id-bar .sync{margin-top:0}

/* ---------- Port: course-game UI details ---------- */
.dept .lock{flex-direction:column;gap:2px;padding:6px 10px;background:transparent!important;border:0!important;box-shadow:none}
.dept .lock .lock-img{width:56px;height:56px;object-fit:contain;display:block;filter:drop-shadow(2px 2px 0 var(--hard))}
.dept .lock .lt{background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:900;font-size:13px}
.node .mno{display:flex;align-items:center;gap:6px}
.node .done-img{width:26px;height:26px;object-fit:contain;margin-left:auto}
.hero-drink img{width:84%}
.report .actions{flex-direction:column;align-items:stretch}
#resHome{order:-1;font-size:20px;padding:14px 22px;background:var(--taro);color:#fff;border:3px solid var(--ink);gap:.5em;width:100%;max-width:340px}
#resHome .home-img{width:34px;height:34px;object-fit:contain;flex:none}
.t-folders{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
.t-folders .lbl{font-weight:900;font-size:14px;margin-right:4px}
.t-folders button{border:2.5px solid var(--ink);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.t-folders button.on{background:var(--taro);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.t-folders button.add{background:var(--chip);border-style:dashed}
.t-assign{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.t-assign select{border:2.5px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);padding:4px 8px;font:inherit;font-weight:700}
.t-fold-tag{display:inline-block;background:var(--taro);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:900;margin-left:6px}
.t-del{border:2.5px solid var(--ink);background:#f8e0da;border-radius:10px;padding:4px 12px;font-weight:900;text-decoration:none;color:#1c1c1c;margin-top:0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<body>

<!-- ================= ONBOARD ================= -->
<section id="onboard">
  <div class="logo">
    <div class="hero-drink"><img id="heroDrink" alt="招牌飲料"></div>
    <h1>一杯剛剛好</h1>
    <div class="tagline">比例對了，味道就對了</div>
    <p>YOUR TEA COMPANY 營業版：你能打造下一杯爆紅手搖飲嗎？</p>
  </div>
  <div class="form-card">
    <div><label for="inName">學生本名</label><input id="inName" type="text" placeholder="請填寫真實姓名（老師看進度用）" maxlength="12"></div>
    <div><label for="inClass">班級座號</label><input id="inClass" type="text" placeholder="例如：101-05" maxlength="12"></div>
    <div><label for="inCompany">公司名稱</label><input id="inCompany" type="text" placeholder="例如：MOOCHA" maxlength="20"></div>
    <div><label for="inDirector">總監姓名</label><input id="inDirector" type="text" placeholder="你的總監角色名" maxlength="12"></div>
  </div>
  <div class="err" id="onErr"></div>
  <div class="actions" style="justify-content:center"><button class="btn" id="startCo" data-ic="store">開始創業</button><button class="btn ghost hidden" id="cancelEdit" data-ic="close">取消</button></div>
  
</section>

<!-- ================= OFFICE ================= -->
<section id="office" class="hidden">
  <div class="office-head">
    <small>辦公桌 · Dashboard</small>
    <h1 id="offCompany"><img class="drink-ico" alt=""><span id="offCompanyName"></span></h1>
    <p id="offHello"></p>
    <div class="id-bar">
      <button class="id-card" id="idCard" type="button" aria-label="更改姓名、公司與總監">
        <span class="id-ava" data-ic="user"></span>
        <span class="id-txt"><b id="idName"></b><small id="idMeta"></small></span>
        <span class="id-edit" data-ic="pencil">更改</span>
      </button>
      <span class="sync" id="syncBadge"></span>
    </div>
  </div>
  <div class="stage-line" id="lineup"></div>
  <div class="path" id="path"></div>
  <div class="office-tools">
    
  </div>
</section>

<div class="fabs">
  <button class="fab" id="sndBtn" type="button"></button>
  <button class="fab" id="setBtn" type="button" aria-label="設定" title="設定" data-ic="gear"></button>
</div>
<div class="pw-mask hidden" id="setMask" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="set-box pop">
    <div class="set-head"><h2 id="setTitle" data-ic="gear">設定</h2><button class="set-x" id="setClose" aria-label="關閉設定" data-ic="close"></button></div>

    <section class="set-sec"><h3 data-ic="vol">聲音</h3>
      <div class="set-row"><span>音樂與音效<small>背景音樂和遊戲音效一起開關</small></span>
        <button class="switch" id="optSound" role="switch" aria-checked="true" aria-label="音樂與音效"><i></i></button></div>
      <div class="set-row"><label for="optVol">音量</label>
        <input type="range" id="optVol" min="0" max="100" step="5"><output id="optVolOut"></output></div>
    </section>

    <section class="set-sec"><h3 data-ic="palette">畫面</h3>
      <div class="set-row"><span>佈景主題</span>
        <div class="seg" id="optTheme" role="radiogroup" aria-label="佈景主題">
          <button data-v="auto" role="radio">跟隨系統</button><button data-v="light" role="radio">淺色</button><button data-v="dark" role="radio">深色</button></div></div>
      <div class="set-row"><span>減少動畫<small>關掉彩紙、晃動等動態效果</small></span>
        <button class="switch" id="optCalm" role="switch" aria-checked="false" aria-label="減少動畫"><i></i></button></div>
    </section>

    <section class="set-sec" id="secCompany"><h3 data-ic="store">我的公司</h3>
      <p class="set-who" id="setWho"></p>
      <button class="btn ghost" id="setRename" data-ic="pencil">更改姓名、公司與總監</button>
    </section>

    <section class="set-sec"><h3 data-ic="chart">教師專區</h3>
      <div id="setTOut"><button class="btn ghost" id="setLogin" data-ic="key">教師登入</button></div>
      <div id="setTIn" class="hidden set-btns">
        <button class="btn" id="setDash" data-ic="chart">教師後台</button>
        <button class="btn ghost" id="setPreview" data-ic="eye">老師預覽模式</button>
        <button class="btn ghost" id="setLogout" data-ic="logout">登出</button>
      </div>
    </section>

    <section class="set-sec set-danger">
      <button class="danger-link" id="setReset" data-ic="reset">清除這台裝置的進度，全部重來</button>
    </section>
  </div>
</div>
<div class="pw-mask hidden" id="pwMask" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
  <div class="pw-box pop">
    <h2 id="pwTitle" data-ic="key">教師登入</h2>
    <p>請輸入教師密碼</p>
    <input id="pwIn" type="password" inputmode="numeric" autocomplete="off" aria-label="教師密碼">
    <div class="err" id="pwErr"></div>
    <div class="actions"><button class="btn" id="pwOk" data-ic="login">登入</button><button class="btn ghost" id="pwCancel">取消</button></div>
  </div>
</div>

<!-- ================= TEACHER DASHBOARD ================= -->
<section id="teacher" class="hidden">
  <div class="office-head"><small>教師後台 · 學生作答分析</small><h1>全班總覽</h1><p id="tNote"></p></div>
  <div class="t-sum" id="tSum"></div>
  <div class="t-chips" id="tChips"></div>
  <div class="t-folders" id="tFolders"></div>
  <div class="t-list" id="tList"></div>
  <div class="office-tools">
    <button class="btn ghost" id="tPreview" data-ic="eye">老師預覽模式（全部解鎖、顯示解答）</button>
    <button class="btn ghost" id="tBack" data-ic="home">回辦公桌</button>
    <button class="btn ghost" id="tLogout" data-ic="logout">登出教師模式</button>
  </div>
</section>

<!-- ================= TOPBAR for chat/core ================= -->
<div class="topbar hidden" id="topbar">
  <button class="back" id="toOffice" data-ic="home">辦公桌</button>
  <b id="tbTitle"></b>
  <span class="teacher-flag hidden" id="tFlag">老師模式</span>
</div>

<!-- ================= CHAT ================= -->
<section id="chat" class="hidden">
  <div class="chat-wrap">
    <div class="chat-host"><img id="chatImg" class="alive" alt=""></div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
  </div>
</section>

<!-- ================= CORE ================= -->
<section id="core" class="hidden">
  <div class="core-card" id="coreBox"></div>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="hidden">
  <div class="hud">
    <span class="lv" id="hudLv"></span>
    <span class="stat">營業額 <b class="money" id="hudMoney">$0</b></span>
    <span class="stat">負評 <span class="hearts" id="hudBad"></span></span>
    <span class="stat combo" id="hudCombo"></span>
    <span class="stat" id="hudProg"></span>
    <span class="stat boss-timer hidden" id="hudBoss"></span>
    <button class="back" id="quit" data-ic="home">辦公桌</button>
  </div>

  <div class="play">
    <div class="host">
      <div class="bubble" id="bubble"></div>
      <img id="hostImg" class="alive" alt="">
    </div>

    <div>

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const gcd = (a,b) => b ? gcd(b, a%b) : Math.abs(a);
const gcd3 = (a,b,c) => gcd(gcd(a,b),c);
const red = arr => { const g = arr.reduce((x,y)=>gcd(x,y)); return arr.map(v=>v/g); };
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const R = arr => arr.join("：");
const ratioChip = s => `<span class="ratio">${s}</span>`;

function tri(max){
  while(true){
    const a=ri(1,max),b=ri(1,max),c=ri(1,max);
    if(gcd3(a,b,c)===1 && !(a===b&&b===c)) return [a,b,c];
  }
}
function chainPair(max){
  // a:b:c such that a:b and b:c reduced forms have different middle terms
  while(true){
    const [a,b,c]=tri(max);
    const g1=gcd(a,b), g2=gcd(b,c);
    const p=a/g1,q=b/g1,r=b/g2,s=c/g2;
    if(q!==r) return {a,b,c,p,q,r,s};
  }
}

/* ---------- question generators ---------- */
function genL1(){
  const set = pick(activeSets()); const [A,B,C] = set.ing.map(x=>x[0]);
  const {a,b,c,p,q,r,s} = chainPair(8);
  const correct = [a,b,c];
  const cand = [[p,q,s],[p,r,s],[p*r,q*r,r*s],[p*s,q*s,r*s],[q,p*r,s],[p+r,b,c]].map(red);
  const key = x => x.join(",");
  const seen = new Set([key(correct)]); const opts=[];
  for(const x of cand){ if(!seen.has(key(x)) && x.every(v=>v>0)){ seen.add(key(x)); opts.push(x); } if(opts.length===3) break; }
  while(opts.length<3){
    const x = red([a+ri(-1,2)||1, b+ri(-1,2)||1, c+ri(0,2)||1]);
    if(!seen.has(key(x))){ seen.add(key(x)); opts.push(x); }
  }
  const all = shuffle([correct, ...opts]);
  return {
    kind:"choice", order:set.name,
    body:`<p class="q">新配方的比例是：<br>${ratioChip(`${A}：${B} ＝ ${p}：${q}`)}<br>${ratioChip(`${B}：${C} ＝ ${r}：${s}`)}</p>`,
    ask:`${A}：${B}：${C} 是多少？（最簡整數比）`,
    options: all.map(R), correctIndex: all.findIndex(x=>key(x)===key(correct)),
    hint:`${B} 在兩個比裡分別是 ${q} 和 ${r}，先把兩個比擴分，讓 ${B} 都變成 ${q} 和 ${r} 的最小公倍數。`,
    solution:`${B} 取 ${q} 和 ${r} 的最小公倍數 ${b}。<br>${A}：${B} ＝ ${p}：${q} ＝ ${a}：${b}（同乘 ${b/q}）<br>${B}：${C} ＝ ${r}：${s} ＝ ${b}：${c}（同乘 ${b/r}）<br>所以 ${A}：${B}：${C} ＝ <b>${a}：${b}：${c}</b>`,
    cup:{layers:set.ing.map((x,i)=>({name:x[0],color:x[1],v:correct[i]})), cap:a+b+c, reveal:true, capText:"答對後會顯示這杯的比例"}
  };
}

function genL2(){
  const set = pick(activeSets()); const names = set.ing.map(x=>x[0]);
  const [a,b,c] = tri(6); const S=a+b+c; const parts=[a,b,c];

      ask:"每種材料各要倒幾 ml？",

      hint:`${names[gi]} 佔 ${parts[gi]} 份，先用 ${parts[gi]*k} ÷ ${parts[gi]} 算出一份是幾 ml。`,

      cup:{layers:set.ing.map((x,i)=>({name:x[0],color:x[1],v:i===gi?parts[i]*k:0})), cap:V, live:true, capText:`完成後約 ${V} ml`}

  };
}

function genL4(){

    solution:`寬：高 ＝ ${w*k1}：${h*k1} ＝ ${w}：${h}<br>一份 ＝ ${w*k2} ÷ ${w} ＝ ${k2} cm<br>高 ＝ ${h} × ${k2} ＝ <b>${h*k2} cm</b>`,
    rect:{w,h,label:`${w}：${h}`}

/* ---------- visuals ---------- */
function cupSVG(layers, cap, pour){
  const W=180,H=260, top=42, bottom=238, lt=30, rt=150, lb=46, rb=134;
  const inner = bottom-top-8;
  const total = layers.reduce((s,l)=>s+(+l.v||0),0);
  let y = bottom-4; let rects="";
  const clipId="cc"+Math.random().toString(36).slice(2,7);
  layers.forEach(l=>{
    const v=+l.v||0; if(v<=0) return;
    const hgt = Math.min(inner, inner * v / cap);
    y -= hgt;
    rects += `<rect x="0" y="${y}" width="${W}" height="${hgt}" fill="${l.color}"/>`;
  });
  const over = total>cap;
  let pearls="";
  if(total>0){ for(let i=0;i<9;i++){ pearls+=`<circle cx="${58+ (i%5)*16 + (i>4?8:0)}" cy="${bottom-12-(i>4?13:0)}" r="6" fill="#2A1D17" opacity=".85"/>`; } }
  const legend = layers.map((l,i)=>`<g transform="translate(0,${i*0})"></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="飲料杯">
    <defs><clipPath id="${clipId}"><path d="M${lt},${top} L${rt},${top} L${rb},${bottom} L${lb},${bottom} Z"/></clipPath></defs>
    <rect x="${W/2+18}" y="2" width="9" height="${top+30}" rx="4" fill="#b98fc9" stroke="#1c1c1c" stroke-width="2" transform="rotate(10 ${W/2+22} 40)"/>
    ${pour?`<clipPath id="${clipId}p"><rect x="0" y="${bottom}" width="${W}" height="0"><animate attributeName="y" from="${bottom}" to="0" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".3 0 .4 1"/><animate attributeName="height" from="0" to="${bottom}" dur="1.1s" fill="freeze" calcMode="spline" keySplines=".3 0 .4 1"/></rect></clipPath>`:""}
    <g clip-path="url(#${clipId})">
      <rect x="0" y="0" width="${W}" height="${H}" fill="rgba(255,255,255,.35)"/>
      <g ${pour?`clip-path="url(#${clipId}p)"`:""}>${rects}${pearls}</g>
      ${pour&&layers[0]?`<rect x="${W/2-4}" y="0" width="8" height="${bottom}" rx="4" fill="${layers.find(l=>+l.v>0)?.color||"#C9955E"}" opacity=".9"><animate attributeName="opacity" values=".9;.9;0" dur="1.2s" fill="freeze"/></rect>`:""}
    </g>
    ${pour?`<g class="steam" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"><path d="M70 20 q-6 -8 0 -16"/><path d="M90 16 q-6 -8 0 -16"/><path d="M110 20 q-6 -8 0 -16"/></g>`:""}
    <path d="M${lt},${top} L${rt},${top} L${rb},${bottom} L${lb},${bottom} Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${lt-8},${top} Q${W/2},${top-34} ${rt+8},${top} Z" fill="rgba(255,255,255,.55)" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    ${over?`<text x="${W/2}" y="${top+26}" text-anchor="middle" font-size="18" fill="#D2566F" font-family="Huninn,sans-serif">滿出來了！</text>`:""}
  </svg>`;
}
function legendHTML(layers){
  return `<div style="display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:13px;margin-top:4px">`+
    layers.map(l=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${l.color};border:1px solid rgba(0,0,0,.2);margin-right:4px"></i>${l.name}</span>`).join("")+`</div>`;
}
function rectSVG(r){
  const max=150, sc = max/Math.max(r.w,r.h); const w=r.w*sc,h=r.h*sc;
  return `<svg viewBox="0 0 180 200" role="img" aria-label="版面比例示意">
    <rect x="${90-w/2}" y="${100-h/2}" width="${w}" height="${h}" rx="6" fill="#F3DDC4" stroke="currentColor" stroke-width="3"/>
    <circle cx="90" cy="${100-h/6}" r="${Math.min(w,h)/6}" fill="#DD5C7A" opacity=".8"/>
    <rect x="${90-w/3}" y="${100+h/8}" width="${w*2/3}" height="8" rx="4" fill="#9A6A44"/>
    <text x="90" y="${100+h/2+22}" text-anchor="middle" font-size="16" fill="currentColor" font-family="Huninn,sans-serif">寬：高 ＝ ${r.label}</text>
  </svg>`;
}
function stackSVG(s){
  const total=s.parts.reduce((a,b)=>a+b,0); const H=170; let y=14; const cols=["#E2A33C","#DD5C7A","#B7C766"];
  let g="";
  s.parts.forEach((p,i)=>{ const h=H*p/total;
    g+=`<rect x="45" y="${y}" width="90" height="${h}" fill="${cols[i]}" opacity="${i===s.hi?1:.45}" stroke="currentColor" stroke-width="2"/>
        <text x="90" y="${y+h/2+5}" text-anchor="middle" font-size="13" fill="#3A2A20" font-family="Huninn,sans-serif">${s.names[i]} ${p}份</text>`;
    y+=h; });
  return `<svg viewBox="0 0 180 200" role="img" aria-label="菜單版面示意">${g}</svg>`;
}

/* ---------- fx helpers ---------- */
let moneyShown=0;
function countMoney(to){
  const el=$("hudMoney"), from=moneyShown, t0=performance.now(), d=600; moneyShown=to;

function flyDrink(){

function nextOrder(){
  clearInterval(timer);
  if(!G.L.boss && G.n>=G.L.orders){ return finish(); }
  G.n++; G.busy=false; G.hinted=false;
  const gen = G.L.boss ? pick(GENS) : GENS[G.lv];
  SFX.play("door"); G.lastTick=-1;
  const Q = gen(); G.Q=Q;
  const cust=G.faces[(G.n-1)%G.faces.length];
  $("faceImg").src=cust.head; $("faceImg").alt=cust.name; $("custName").textContent=cust.name;
  $("face").className="face"; $("mood").textContent="";
  $("orderName").textContent=`點單：${Q.order}`;
  $("qBody").innerHTML=Q.body+`<p class="ask">${Q.ask}</p>`;
  $("msg").textContent=""; $("verdict").innerHTML="";
  renderAnswer(Q); renderSide(Q, false);
  updHUD(); renderQueue(); $("patWrap").classList.remove("low");
  $("ticket").classList.remove("pop"); void $("ticket").offsetWidth; $("ticket").classList.add("pop");
  G.start=Date.now(); G.limit=(G.L.patience||60)*1000;
  timer=setInterval(tick,100); tick();
  const first=$("answerArea").querySelector("input:not(:disabled),button.opt"); if(first) first.focus({preventScroll:true});
}

function renderAnswer(Q){
  const A=$("answerArea");
  let html="";
  if(Q.kind==="choice"){
    html=`<div class="options">${Q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>`;
  } else {
    html=`<div class="fields">${Q.fields.map((f,i)=>`
      <div class="field">${f.color?`<span class="sw" style="background:${f.color}"></span>`:""}
        <label for="f${i}">${f.label}</label>
        <input id="f${i}" type="number" inputmode="numeric" ${f.given?`value="${f.answer}" disabled`:""} aria-label="${f.label}（${f.unit}）">
        <span>${f.unit}</span></div>`).join("")}</div>`;
  }
  html+=`<div class="actions">${Q.kind==="input"?`<button class="btn" id="serve">${I("cup")}出杯！</button>`:""}<button class="btn ghost" id="hintBtn">${I("bulb")}看提示（獎金減半）</button></div>`;
  A.innerHTML=html;
  if(Q.kind==="choice") A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>judge(+b.dataset.i));
  else{
    $("serve").onclick=()=>judge();
    A.querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("input",()=>renderSide(G.Q,false));
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") judge(); });
    });
  }
  $("hintBtn").onclick=()=>{ if(G.busy) return; G.hinted=true; $("msg").style.color="var(--ink-soft)"; $("msg").innerHTML=I("bulb")+" "+Q.hint; $("hintBtn").disabled=true; };
}

function renderSide(Q, done){
  const box=$("cupSvg"), cap=$("cupCap");
  if(Q.cup){
    let layers=Q.cup.layers.map(l=>({...l}));
    if(Q.cup.live && Q.kind==="input"){
      Q.fields.forEach((f,i)=>{ const el=$("f"+i); layers[i].v = el? (parseFloat(el.value)||0) : 0; });
    }
    if(Q.cup.reveal && !done) layers=layers.map(l=>({...l,v:0}));
    box.innerHTML=cupSVG(layers,Q.cup.cap,done)+legendHTML(Q.cup.layers);
    cap.textContent=Q.cup.capText||"";
  } else if(Q.rect){ box.innerHTML=rectSVG(Q.rect); cap.textContent="等比例縮放，形狀不能變"; }
  else if(Q.stack){ box.innerHTML=stackSVG(Q.stack); cap.textContent="菜單版面示意"; }
  else { box.innerHTML=cupSVG([{v:1,color:"#C9955E"}],1.4); cap.textContent="財務部帳本"; }

function tick(){
  if(G.L.boss){
    const left=Math.max(0,G.bossEnd-Date.now());
    $("hudBoss").innerHTML=`${I("clock")} ${Math.ceil(left/1000)} 秒`;
    const sec=Math.ceil(left/1000); if(sec<=10 && sec>0 && sec!==G.lastTick){ G.lastTick=sec; SFX.play("tick"); }
    if(left<=0){ clearInterval(timer); finish(); }
    return;
  }
  if(G.busy) return;
  const left=Math.max(0,G.limit-(Date.now()-G.start)); const pct=left/G.limit;
  const bar=$("pat"); bar.style.width=(pct*100)+"%";
  bar.style.background = pct>.5?"var(--matcha)":pct>.25?"var(--honey)":"var(--berry)";
  const low=pct<=.25;
  if(low){ const sec=Math.ceil(left/1000); if(sec!==G.lastTick){ G.lastTick=sec; SFX.play("tick"); } } $("patWrap").classList.toggle("low",low); $("face").classList.toggle("hurry",low&&!G.busy);
  if(left<=0){ judge(null,true); }
}

function popBubble(){ const b=$("bubble"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
function judge(choice, timeout){
  if(G.busy) return;
  const Q=G.Q; let right=false;
  if(!timeout){
    if(Q.kind==="choice"){ right = choice===Q.correctIndex; }
    else{
      const vals=Q.fields.map((f,i)=>$("f"+i).value.trim());
      if(vals.some(v=>v==="")){ $("msg").style.color="var(--berry)"; $("msg").textContent="還有欄位沒填，填完再出杯。"; return; }
      right = Q.fields.every((f,i)=>Number(vals[i])===f.answer);
      Q.fields.forEach((f,i)=>{ const el=$("f"+i); if(!f.given) el.classList.add(Number(vals[i])===f.answer?"ok":"bad"); });
    }
  }
  G.busy=true; if(!G.L.boss) clearInterval(timer);
  $("answerArea").querySelectorAll("button,input").forEach(b=>b.disabled=true);
  if(Q.kind==="choice"){
    $("answerArea").querySelectorAll(".opt").forEach((b,i)=>{ if(i===Q.correctIndex) b.classList.add("right"); else if(i===choice) b.classList.add("wrong"); });
  }
  renderSide(Q,true);
  let head;
  if(right){
    G.ok++; G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);
    let gain = 60;
    if(!G.L.boss){ const left=Math.max(0,G.limit-(Date.now()-G.start)); gain += Math.round(left/1000)*2; }
    gain += (G.combo-1)*10; if(G.hinted) gain=Math.round(gain/2);
    G.money+=gain;
    $("bubble").textContent=pick(GOOD_LINES);
    head=`<h3>${I("smile")}出杯成功！＋$${gain}</h3>`;
    SFX.play("correct"); SFX.play("pour"); setTimeout(()=>SFX.play("coin"),450);
    $("face").className="face happy"; flyDrink(); queueMood("happy"); countMoney(G.money); floatText("+$"+gain, $("face")); confetti(22); $("mood").textContent=pick(["好喝！","比例剛好！","回購！"]);
  } else {
    G.bad++; G.combo=0;
    $("bubble").textContent= timeout? "客人等太久，生氣離開了⋯⋯看一下解法吧。" : pick(BAD_LINES);
    head=`<h3>${I("angry")}${timeout?"客人等不及走掉了":"比例不對，客人給了負評"}</h3>`;
    SFX.play("wrong");
    $("face").className="face angry"; queueMood("angry"); floatText("負評 +1", $("face"), true); $("mood").textContent= timeout? "等太久了…" : "味道怪怪的…";
  }
  updHUD(); popBubble();
  const failed = G.bad>=3;
  const bossDone = G.L.boss && G.ok>=G.L.bossGoal;
  const lastOrder = !G.L.boss && G.n>=G.L.orders;
  const btnText = failed||bossDone||lastOrder ? "看成績單" : "下一位客人";
  $("verdict").innerHTML=`<div class="verdict ${right?"good":"badv"} pop">${head}<div>${Q.solution}</div>
    <div class="actions"><button class="btn" id="goNext">${btnText}${I("right")}</button></div></div>`;
  $("goNext").onclick=()=>{ if(failed||bossDone) finish(); else leaveThen(nextOrder); };
  $("goNext").focus({preventScroll:true});
  $("verdict").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function finish(){
  clearInterval(timer);
  const L=G.L; const passed = L.boss ? (G.ok>=L.bossGoal && G.bad<3) : G.bad<3;
  const stars = passed ? Math.max(1,3-G.bad) : 0;
  { const d=S.depts[G.lv]; d.tries=(d.tries||0)+1; d.ok=(d.ok||0)+G.ok; d.bad=(d.bad||0)+G.bad;
    d.best=Math.max(d.best||0,G.money); if(passed) d.rush=Math.max(d.rush,stars); saveS(); }
  $("resPlan").innerHTML = (L.boss && passed) ? planHTML() : "";
  $("resImg").src=IMG[L.key]; $("resImg").alt=L.dept;
  $("resTitle").textContent = passed ? `${L.dept} 任務完成！` : `${L.dept} 任務失敗`;
  $("resStars").innerHTML = [0,1,2].map(k=>`<span>${k<stars?"★":"☆"}</span>`).join("");

/* ---------- chat engine ---------- */
let chatToken=0;
function playChat(i, msgs){
  const L=LEVELS[i];
  go("chat", `${L.dept}｜${L.course}`);
  $("chatImg").src=IMG[L.key]; $("chatImg").alt=L.dept;
  const log=$("chatLog"); log.innerHTML="";
  const tk=++chatToken; let k=0;
  const step=()=>{
    if(tk!==chatToken || k>=msgs.length) return;
    const m=msgs[k++]; const el=document.createElement("div");
    if((m.text||m.receipt||m.explain) && !m._typed && !calm()){
      m._typed=true; k--; const ty=document.createElement("div"); ty.className="typing"; ty.innerHTML="<i></i><i></i><i></i>";
      log.appendChild(ty); ty.scrollIntoView({behavior:"smooth",block:"nearest"});
      if(!m.receipt){ SFX.play("type"); setTimeout(()=>SFX.play("type"),140); setTimeout(()=>SFX.play("type"),280); }
      setTimeout(()=>{ ty.remove(); step(); }, m.receipt?350:520); return;
    }
    if(m.text){ el.className="msg-b"; el.innerHTML=m.text; }
    else if(m.receipt){ el.className="receipt "+(k%2?"l":"r"); el.innerHTML=`${m.receipt.title}<big>${m.receipt.ratio}</big>`; }
    else if(m.explain){ el.className="explain"; el.innerHTML=m.explain; }
    else if(m.choices){ el.className="choice-row"; m.choices.forEach(c=>{ const b=document.createElement("button"); b.className="choice"; b.innerHTML=c.label; b.onclick=()=>{ el.querySelectorAll("button").forEach(x=>x.disabled=true); b.style.borderColor="var(--honey)"; c.fn(); }; el.appendChild(b); }); }
    else if(m.cont){ el.className="actions"; const b=document.createElement("button"); b.className="btn"; b.innerHTML=m.cont.label; b.onclick=()=>{ b.disabled=true; m.cont.fn(); }; el.appendChild(b); }
    log.appendChild(el); el.scrollIntoView({behavior:"smooth",block:"nearest"});
    if(m.receipt) SFX.play("drop"); else if(m.text||m.explain) SFX.play("pop");
    if(!m.choices && !m.cont) setTimeout(step, m.wait||380);
  };
  step();
  return { push:(more)=>{ msgs.push(...more); step(); } };
}

/* ---------- puzzle engine (連比例) ---------- */
function puzzle(i, cfg, onSolved){
  let mA=1, mB=1;
  const A=cfg.A, B=cfg.B, shared=A.items[A.si];
  const L=lcm(A.vals[A.si],B.vals[B.si]);
  const ansVals = cfg.order.map(n=>{ const ia=A.items.indexOf(n), ib=B.items.indexOf(n); return ia>=0? A.vals[ia]*L/A.vals[A.si] : B.vals[ib]*L/B.vals[B.si]; });
  coreShow(i, `<div class="core-step">${cfg.step||"核心關卡"}</div>
    <p class="core-prompt">${cfg.story}</p>${tAns(`${A.items[0]} ×${L/A.vals[A.si]}、${B.items[1]} 那張 ×${L/B.vals[B.si]} → ${cfg.order.join("：")} ＝ ${ansVals.join("：")}`)}
    <div class="ratio-card"><div class="lab">配方紙 ①　${A.items.join("：")}</div><div class="ratio-line" id="lA"></div>
      <div class="mult">放大倍數 ×<button data-s="A" data-d="-1" aria-label="減少">−</button><input id="mA" type="number" min="1" max="99" value="1"><button data-s="A" data-d="1" aria-label="增加">＋</button></div></div>
    <div class="ratio-card"><div class="lab">配方紙 ②　${B.items.join("：")}</div><div class="ratio-line" id="lB"></div>
      <div class="mult">放大倍數 ×<button data-s="B" data-d="-1" aria-label="減少">−</button><input id="mB" type="number" min="1" max="99" value="1"><button data-s="B" data-d="1" aria-label="增加">＋</button></div></div>
    <div class="match" id="match"></div><div class="combined" id="comb"></div>
    <div class="actions"><button class="btn" id="lock">鎖定黃金連比 →</button></div>`);
  const upd=()=>{
    const term=(v,sh)=>`<span class="term ${sh?"shared":""}">${v}</span>`;
    $("lA").innerHTML=A.vals.map((v,k)=>term(v*mA,k===A.si)).join("<span>：</span>");
    $("lB").innerHTML=B.vals.map((v,k)=>term(v*mB,k===B.si)).join("<span>：</span>");
    const a=A.vals[A.si]*mA, b=B.vals[B.si]*mB, ok=a===b;
    $("match").className="match"+(ok?" ok":"");
    $("match").textContent=`共同項「${shared}」：配方紙① = ${a}，配方紙② = ${b}${ok?"　✓ 一樣大了！":""}`;
    const vals={}; A.items.forEach((n,k)=>vals[n]=A.vals[k]*mA); B.items.forEach((n,k)=>vals[n]=B.vals[k]*mB);
    $("comb").textContent = ok ? `${cfg.order.join("：")} ＝ ${cfg.order.map(n=>vals[n]).join("：")}` : "";
    $("lock").disabled = !(ok||TEACHER);
    if(ok && !upd._was) SFX.play("match"); upd._was=ok;
    return {ok, vals: cfg.order.map(n=>vals[n])};
  };
  const setM=(s,v)=>{ v=Math.max(1,Math.min(99,v|0||1)); if(s==="A") mA=v; else mB=v; $("m"+s).value=v; upd(); };
  $("coreBox").querySelectorAll(".mult button").forEach(b=>b.onclick=()=>setM(b.dataset.s,(b.dataset.s==="A"?mA:mB)+(+b.dataset.d)));
  $("mA").oninput=e=>{ if(e.target.value!=="") setM("A",+e.target.value); };
  $("mB").oninput=e=>{ if(e.target.value!=="") setM("B",+e.target.value); };
  $("lock").onclick=()=>{ const r=upd(); onSolved(r.ok? r.vals : ansVals); };
  upd();
}
function lcm(a,b){ return a*b/gcd(a,b); }

/* ---------- calc wizard ---------- */
function wizard(i, steps, given, onDone){
  let idx=0; const hist=[];
  const render=()=>{
    const st=steps[idx]; const recap=[...given,...hist];
    coreShow(i, `<div class="core-step">核心關卡 · STEP ${idx+1} / ${steps.length}</div>
      ${recap.length?`<div class="recap">${recap.map(r=>`<span>${r.label} <b>${r.value}</b></span>`).join("")}</div>`:""}
      <p class="core-prompt">${st.prompt}</p>
      ${st.hint?`<button class="hint-t" id="hintT">${I("bulb")}需要提示嗎？</button><div class="hint-box" id="hintB">${st.hint}</div>`:""}
      ${tAns(st.fields.map(f=>`${f.label} = ${f.exp}${f.unit||""}`).join("　"))}
      <div class="fields">${st.fields.map((f,k)=>`<div class="field"><label for="w${k}">${f.label}</label><input id="w${k}" type="number" inputmode="decimal"><span>${f.unit||""}</span></div>`).join("")}</div>
      <div class="okmsg" id="wOk"></div>
      <div class="actions"><button class="btn" id="wNext" ${TEACHER?"":"disabled"}>${idx===steps.length-1?"完成 →":"下一步 →"}</button></div>`);
    if(st.hint) $("hintT").onclick=()=>$("hintB").classList.toggle("show");
    const check=()=>{
      let all=true;
      st.fields.forEach((f,k)=>{ const el=$("w"+k), v=parseFloat(el.value), ok=!isNaN(v)&&Math.abs(v-f.exp)<=(f.tol??0.5);
        el.classList.remove("ok","bad"); if(el.value!=="") el.classList.add(ok?"ok":"bad"); if(!ok) all=false; });
      if(all && !check._was) SFX.play("match"); check._was=all;
      $("wOk").textContent = all?"✓ 答對了！":"";
      $("wNext").disabled = !(all||TEACHER);
      return all;
    };
    st.fields.forEach((f,k)=>{ $("w"+k).oninput=check; $("w"+k).onkeydown=e=>{ if(e.key==="Enter" && !$("wNext").disabled) $("wNext").click(); }; });
    $("wNext").onclick=()=>{ st.fields.forEach(f=>hist.push({label:f.label,value:f.exp+(f.unit?" "+f.unit:"")})); idx++; idx<steps.length?render():onDone(); };
    const first=$("w0"); if(first) first.focus({preventScroll:true});
  };
  render();
}

const SFX=(()=>{
  let ctx=null, master=null, noiseBuf=null, on=AUDIO.on;
  function ac(){
    if(!on) return null;
    if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      ctx=new C(); const comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=.8*AUDIO.vol;
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*1.5,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function tone(f,o={}){ const c=ac(); if(!c) return;
    const {t=0,d=.15,type="sine",v=.15,slide=0,a=.005}=o, t0=c.currentTime+t;
    const osc=c.createOscillator(), g=c.createGain(); osc.type=type; osc.frequency.setValueAtTime(f,t0);
    if(slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+d+.05); }
  function noise(o={}){ const c=ac(); if(!c) return;
    const {t=0,d=.3,v=.08,type="bandpass",f1=800,f2=800,q=1}=o, t0=c.currentTime+t;
    const src=c.createBufferSource(); src.buffer=noiseBuf; const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q;
    fl.frequency.setValueAtTime(f1,t0); fl.frequency.exponentialRampToValueAtTime(f2,t0+d);
    const g=c.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+.03); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t0); src.stop(t0+d+.05); }
  const N={C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5,E6:1318.5,G4:392,F4:349.23,E4:329.63,D4:293.66};
  const P={

    correct(){ [N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>tone(f,{t:i*.07,d:.22,type:"triangle",v:.13})); },
    coin(){ tone(N.B5,{d:.08,type:"square",v:.05}); tone(N.E6,{t:.07,d:.3,type:"square",v:.05}); },

    pour(){ noise({d:1.0,v:.07,f1:350,f2:1400,q:2}); for(let i=0;i<6;i++) tone(500+Math.random()*500,{t:.15+i*.13,d:.06,slide:250,v:.05}); },
    whoosh(){ noise({d:.45,v:.06,type:"highpass",f1:600,f2:4000}); },

    match(){ tone(N.G5,{d:.12,type:"triangle",v:.1}); tone(N.C6,{t:.08,d:.25,type:"triangle",v:.1}); },
    star(i){ tone([N.E5,N.G5,N.C6][i]||N.C6,{d:.3,type:"triangle",v:.12}); tone(([N.E5,N.G5,N.C6][i]||N.C6)*2,{d:.2,v:.04}); },
    fanfare(){ [N.G4,N.C5,N.E5,N.G5].forEach((f,i)=>tone(f,{t:i*.11,d:.2,type:"square",v:.06}));
      [N.C5,N.E5,N.G5,N.C6].forEach(f=>tone(f,{t:.48,d:.9,type:"triangle",v:.08})); },
    fail(){ [N.G4,N.F4,N.E4,N.D4].forEach((f,i)=>tone(f,{t:i*.18,d:.3,type:"triangle",v:.1})); },
    unlock(){ tone(N.C5,{d:.12,type:"triangle",v:.1}); tone(N.G5,{t:.1,d:.3,type:"triangle",v:.1}); }
  };
  return {
    play(name,arg){ if(!on) return; try{ P[name]&&P[name](arg); }catch(e){} },
    get on(){ return on; },
    set(v){ on=v; if(on){ ac(); P.pop(); } },
    vol(v){ if(master) master.gain.value=.8*v; }
  };
})();

/* ================= BACKGROUND MUSIC（原創曲，Web Audio 即時合成） ================= */
const BGM=(()=>{
  let ctx=null, out=null, noiseBuf=null, on=AUDIO.on, playing=false, timerId=null, step=0, nextT=0, bpm=112, targetBpm=112;
  const m=n=>440*Math.pow(2,(n-69)/12);
  // 8 小節 × 8 個八分音符；數字為 MIDI 音高，0 為休止
  const MEL=[
    76,0,79,0,81,79,76,0,   72,0,76,0,74,72,69,0,
    69,72,77,0,76,0,72,0,   74,0,76,74,71,0,67,0,
    76,79,84,0,83,0,79,0,   81,0,79,76,72,0,76,0,
    77,0,76,74,69,0,74,0,   71,0,74,0,79,77,74,71];
  const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62],[60,64,67],[57,60,64],[50,53,57],[55,59,62]];
  const BASS=[36,33,29,31,36,33,26,31];
  function ensure(){
    if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      ctx=new C(); out=ctx.createGain(); out.gain.value=0; out.connect(ctx.destination);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function note(f,t,d,type,v){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.03); }
  function shaker(t,v){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=7000;
    const g=ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.05); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.06); }
  function schedule(i,t){
    const e=60/bpm/2, bar=Math.floor(i/8)%8, pos=i%8;
    const mel=MEL[(i)%64]; if(mel) note(m(mel),t,e*1.6,"triangle",.11), note(m(mel+12),t,e*.6,"sine",.025);
    if(pos===0||pos===4) note(m(BASS[bar]),t,e*1.8,"triangle",.16);
    if(pos===2||pos===6) note(m(BASS[bar]+7),t,e*1.2,"triangle",.1);
    if(pos%2===1) CH[bar].forEach(n=>note(m(n),t,e*.55,"square",.018));
    shaker(t, pos%2? .035 : .02);
    if(pos===0) { const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.0001,t+.15); o.connect(g); g.connect(out); o.start(t); o.stop(t+.17); }
  }
  function loop(){ if(!playing) return;
    bpm += (targetBpm-bpm)*.2;
    while(nextT < ctx.currentTime+.15){ schedule(step,nextT); nextT += 60/bpm/2; step=(step+1)%64; } }
  function start(){ if(!on||playing) return; if(!ensure()) return;
    playing=true; nextT=ctx.currentTime+.08; step=0;
    out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setValueAtTime(0,ctx.currentTime); out.gain.linearRampToValueAtTime(.55*AUDIO.vol,ctx.currentTime+1.2);
    timerId=setInterval(loop,30); }
  function stop(){ if(!playing) return; playing=false; clearInterval(timerId);
    const n=ctx.currentTime; out.gain.cancelScheduledValues(n); out.gain.setValueAtTime(out.gain.value,n); out.gain.linearRampToValueAtTime(0,n+.3); }
  document.addEventListener("visibilitychange",()=>{ if(!ctx) return; document.hidden? ctx.suspend() : (playing&&ctx.resume()); });
  return {
    get on(){ return on; },
    kick(){ if(on && !playing) start(); },
    tempo(b){ targetBpm=b; },
    set(v){ on=v; on?start():stop(); },
    vol(v){ if(ctx&&playing){ const n=ctx.currentTime; out.gain.cancelScheduledValues(n); out.gain.setTargetAtTime(.55*v,n,.05); } }
  };
})();
