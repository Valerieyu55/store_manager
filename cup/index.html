function openTeacher(){
  if(!T_AUTH){ askTeacher(); return; }
  go("teacher");
  if(!DB){ $("tNote").textContent="這個檢視無法讀取雲端資料。"; renderTeacher(); return; }
  $("tNote").textContent="學生每完成一個步驟，這裡會即時更新。"; loadFolders().then(()=>{ if(!$("teacher").classList.contains("hidden")) renderTeacher(); });
  if(!tUnsub){
    tUnsub = DB.collection("records").onSnapshot(snap=>{
      tRecords = snap.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}));
      if(!$("teacher").classList.contains("hidden")) renderTeacher();
    }, err=>{ tUnsub=null;
      $("tNote").textContent = (err && err.code==="permission_denied")
        ? "密碼正確，但這個 Claude 帳號沒有讀取全班資料的權限。請用頁面擁有者（或管理員）的帳號開啟。"
        : "連線中斷，請重新整理頁面。"; });
  }
  renderTeacher();
}
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function renderTeacher(){
  const all=tRecords.filter(r=>r.student);
  const classes=[...new Set(all.map(r=>r.cls||"未填班級"))].sort();
  if(tFilter!=="all" && !classes.includes(tFilter)) tFilter="all";
  if(tFold!=="all" && tFold!=="__none" && !tFolders.list.includes(tFold)) tFold="all";
  const byCls = tFilter==="all"? all : all.filter(r=>(r.cls||"未填班級")===tFilter);
  const fOf=r=>tFolders.map[r.id]&&tFolders.list.includes(tFolders.map[r.id])?tFolders.map[r.id]:"";
  const rs = tFold==="all"? byCls : tFold==="__none"? byCls.filter(r=>!fOf(r)) : byCls.filter(r=>fOf(r)===tFold);
  $("tFolders").innerHTML = `<span class="lbl">資料夾</span><button data-f="all" class="${tFold==="all"?"on":""}">全部</button><button data-f="__none" class="${tFold==="__none"?"on":""}">未分類 (${byCls.filter(r=>!fOf(r)).length})</button>`
    + tFolders.list.map(f=>`<button data-f="${esc(f)}" class="${tFold===f?"on":""}">${esc(f)} (${byCls.filter(r=>fOf(r)===f).length})</button>`).join("")
    + `<button class="add" id="fAdd">＋ 新增資料夾</button>` + (tFold!=="all"&&tFold!=="__none"?`<button class="add" id="fDel">刪除「${esc(tFold)}」資料夾</button>`:"");
  $("tFolders").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ tFold=b.dataset.f; renderTeacher(); });
  $("fAdd").onclick=async()=>{ const n=(prompt("資料夾名稱（例如：第一組、補救教學）")||"").trim(); if(!n||tFolders.list.includes(n)) return; tFolders.list.push(n); await saveFolders(); renderTeacher(); };
  if($("fDel")) $("fDel").onclick=async()=>{ if(!confirm("刪除資料夾「"+tFold+"」？學生紀錄不會被刪除，只會回到未分類。")) return; tFolders.list=tFolders.list.filter(x=>x!==tFold); Object.keys(tFolders.map).forEach(k=>{ if(tFolders.map[k]===tFold) delete tFolders.map[k]; }); tFold="all"; await saveFolders(); renderTeacher(); };
  const n=rs.length;
  const m1a=rs.filter(r=>r.m1First!==null&&r.m1First!==undefined), m1ok=m1a.filter(r=>r.m1First).length;
  let ok=0,bad=0; rs.forEach(r=>(r.depts||[]).forEach(d=>{ ok+=d.ok||0; bad+=d.bad||0; }));
  const doneAll=rs.filter(r=>r.depts&&r.depts[4]&&r.depts[4].rush>0).length;
  const deptCards = LEVELS.map((L,i)=>{ const c=rs.filter(r=>r.depts&&r.depts[i]&&r.depts[i].rush>0).length;
    return `<div class="t-card"><small>${L.dept} 通關</small><b>${c} / ${n}</b><div class="bar"><i style="width:${pct(c,n)}%"></i></div></div>`; }).join("");
  $("tSum").innerHTML = `
    <div class="t-card"><small>學生人數</small><b>${n}</b></div>
    <div class="t-card"><small>完成新品發表會</small><b>${pct(doneAll,n)}%</b></div>
    <div class="t-card"><small>研發部一開始就發現配方問題</small><b>${m1a.length? pct(m1ok,m1a.length)+"%" : "—"}</b></div>
    <div class="t-card"><small>營業衝刺答對率</small><b>${ok+bad? pct(ok,ok+bad)+"%" : "—"}</b></div>
    <div class="t-depts">${deptCards}</div>`;
  $("tChips").innerHTML = ["all",...classes].map(c=>`<button data-c="${esc(c)}" class="${c===tFilter?"on":""}">${c==="all"?`全部 (${all.length})`:`${esc(c)} (${all.filter(r=>(r.cls||"未填班級")===c).length})`}</button>`).join("");
  $("tChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{ tFilter=b.dataset.c; renderTeacher(); });
  if(!n){ $("tList").innerHTML=`<div class="t-empty">還沒有學生資料。學生填好姓名開始遊戲後，進度會出現在這裡。</div>`; return; }
  const sorted=[...rs].sort((a,b)=>(a.cls||"").localeCompare(b.cls||"")||(a.student||"").localeCompare(b.student||""));
  $("tList").innerHTML = sorted.map(r=>{
    const ds=r.depts||[];
    const dots=LEVELS.map((L,i)=>{ const d=ds[i]||{}; const cls=d.rush>0?"done":(d.core||d.story)?"mid":"";
      return `<span class="${cls}" title="${L.dept}">${d.rush>0?"★"+d.rush:i+1}</span>`; }).join("");
    let o=0,b=0; ds.forEach(d=>{o+=d.ok||0;b+=d.bad||0;});
    const when = r.updatedAt? new Date(r.updatedAt).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
    const grid=LEVELS.map((L,i)=>{ const d=ds[i]||{};
      return `<div><b>${L.dept}</b>${d.core?"✓ 核心關卡":"○ 核心關卡"}<br>星星 ${"★".repeat(d.rush||0)||"—"}<br>挑戰 ${d.tries||0} 次<br>答對 ${d.ok||0}／答錯 ${d.bad||0}<br>最高營業額 $${d.best||0}</div>`; }).join("");
    const m1 = r.m1First===true?I("checkc")+" 一開始就發現配方有問題":r.m1First===false?I("xc")+" 一開始選了「可以，先開始生產」":"尚未作答";
    const plan = (r.custom&&r.custom.ratio&&r.plan)? `<div class="plan-doc"><div class="brand">${esc(r.company)} · 新品企劃書</div><div class="drink">${esc(r.custom.name)}</div>
      <div class="row"><span>黃金連比（${r.custom.items.map(esc).join("：")}）</span><b>${r.custom.ratio.join("：")}</b></div>
      <div class="row"><span>售價／成本</span><b>$${r.plan.price}／$${r.plan.cost}</b></div>${r.plan.slogan?`<div class="slogan">「${esc(r.plan.slogan)}」</div>`:""}</div>` : "";
    return `<div class="t-row ${tOpen===r.id?"open":""}" data-id="${esc(r.id)}">
      <button class="t-head"><span><b>${esc(r.student)}</b><small>${esc(r.cls||"未填班級")} · ${esc(r.company)}${fOf(r)?`<span class="t-fold-tag">${esc(fOf(r))}</span>`:""}</small></span>
        <span class="dots">${dots}</span><span class="t-rate">答對率 ${o+b?pct(o,o+b)+"%":"—"}</span><small>${when}</small></button>
      <div class="t-detail"><p style="margin:0 0 8px">研發部第一次選擇：${m1}</p><div class="t-grid">${grid}</div>${plan}
        <div class="t-assign"><b>放進資料夾：</b><select data-asg="${esc(r.id)}"><option value="">未分類</option>${tFolders.list.map(f=>`<option value="${esc(f)}" ${fOf(r)===f?"selected":""}>${esc(f)}</option>`).join("")}</select>
        <button class="t-del" data-del="${esc(r.id)}">刪除這筆紀錄</button></div></div></div>`;
  }).join("");
  $("tList").querySelectorAll(".t-head").forEach(h=>h.onclick=()=>{ const id=h.parentElement.dataset.id; tOpen = tOpen===id? null : id; renderTeacher(); });
  $("tList").querySelectorAll("[data-asg]").forEach(sel=>sel.onchange=async()=>{ if(sel.value) tFolders.map[sel.dataset.asg]=sel.value; else delete tFolders.map[sel.dataset.asg]; await saveFolders(); renderTeacher(); });
  $("tList").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("確定刪除這位學生的紀錄？（學生下次操作時會重新上傳）")) return;
    try{ await DB.doc("records/"+b.dataset.del).delete(); }catch(e){ alert("刪除失敗，請稍後再試。"); }
  });
}

  document.querySelectorAll(".teacher-only").forEach(el=>el.classList.add("hidden")); $("tFlag").classList.add("hidden");
  if(S.company&&S.student) renderOffice(); else go("onboard"); }
